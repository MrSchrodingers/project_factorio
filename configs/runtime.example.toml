[dashboard]
host = "127.0.0.1"
port = 8765
poll_interval_s = 1.5

[planner]
astar_turn_penalty = 0.10

[learning]
algorithm = "ucb1"
ucb_exploration = 2.0
neural_policy = "cnn_attention"
world_model = "explicit_residual"

[[llm.providers]]
id = "local-qwen"
kind = "openai_compatible"
base_url = "http://127.0.0.1:18081/v1"
model = "qwen3-4b"
cost_class = "local"
priority = 10
enabled = true

[[llm.providers]]
id = "openrouter-free"
kind = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
model = "openrouter/free"
api_key_env = "OPENROUTER_API_KEY"
cost_class = "free"
priority = 20
enabled = false

[llm.generation]
temperature = 0.20
max_tokens = 768
